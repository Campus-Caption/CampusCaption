<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CampusCaption Overlay</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@500;700&display=swap" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect y=%223%22 width=%2216%22 height=%224%22 fill=%22%2315233f%22/%3E%3Crect y=%229%22 width=%2210%22 height=%224%22 fill=%22%23d7263d%22/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/static/css/captions.css" />
  <link rel="stylesheet" href="/static/css/overlay.css" />
</head>
<body>
  <main id="stage" class="stage">
    <div id="box" class="cap-box"><div id="caps" class="cap-scroll" aria-live="polite"></div></div>
    <p id="hint" class="hint"></p>
  </main>
  <!-- Room code + QR so students can follow on their phones (toggle: Join code button or the j key) -->
  <aside id="join-card" class="join-card" aria-label="Follow the captions on your phone" hidden>
    <img id="join-qr" alt="QR code to follow the captions on your phone" width="140" height="140" />
    <div class="jc-text">
      <p class="jc-h">Captions on your phone</p>
      <p id="join-code" class="jc-code"></p>
      <p id="join-url" class="jc-url"></p>
    </div>
  </aside>
  <nav id="bar" class="bar" aria-label="Caption settings">
    <button id="b-toggle" type="button" aria-pressed="true" title="Captions on/off">Captions: on</button>
    <button id="b-join" type="button" aria-pressed="true" title="Show the room code for phones">Join code</button>
    <button id="b-minus" type="button" title="Smaller text">A−</button>
    <button id="b-plus" type="button" title="Larger text">A+</button>
    <button id="b-lines" type="button" title="Number of lines">3 lines</button>
    <button id="b-theme" type="button" title="Colour scheme">Dark</button>
    <button id="b-pip" type="button" title="Floating window">Pop-out</button>
    <button id="b-full" type="button" title="Fullscreen">Fullscreen</button>
  </nav>
  <script src="/static/js/captions-view.js"></script>
  <script src="/static/js/overlay.js"></script>
</body>
</html>
