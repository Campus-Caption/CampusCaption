services:
  campuscaption:
    build:
      context: .
    ports:
      - "127.0.0.1:8080:8080"   # set LECTURER_SECRET in .env before exposing this beyond your own machine
      # Students' phones on the network: use this line instead, and set LECTURER_SECRET and
      # PUBLIC_URL (e.g. http://192.168.1.20:8080) in .env, since the container can't see the host's address.
      # - "8080:8080"
    env_file: .env
    environment:
      STT_MODEL_DIR: /app/data/models   # downloaded speech models live in the volume
    volumes:
      - ./app:/app/app
      - ./frontend:/app/frontend
      - campuscaption-data:/app/data
    restart: unless-stopped

volumes:
  campuscaption-data:
