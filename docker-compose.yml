services:
  campuscaption:
    build:
      context: .
    ports:
      - "127.0.0.1:8080:8080"   # set LECTURER_SECRET in .env before exposing this beyond your own machine
    env_file: .env
    environment:
      STT_MODEL_DIR: /app/data/models   # downloaded speech models live in the volume
    volumes:
      - ./app:/app/app
      - ./frontend:/app/frontend
      - campuscaption-data:/app/data
    restart: unless-stopped

volumes:
  campuscaption-data:
